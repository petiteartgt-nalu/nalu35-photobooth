
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NaLu's 35 Photobooth</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #100719;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.app {
  height: 100dvh;
  max-width: 520px;
  margin: auto;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}

h1 {
  color: #ff38be;
  font-size: 24px;
  margin: 5px 0 2px;
  text-shadow: 0 0 12px #f09;
}

.subtitulo {
  font-size: 11px;
  color: #76edfa;
  margin: 0 0 7px;
}

#escenario {
  position: relative;
  flex: 1;
  min-height: 0;
  max-width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#lienzo {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 6px;
}

#cuenta {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 95px;
  font-weight: bold;
  color: white;
  text-shadow: 0 0 20px #ff00c8;
  pointer-events: none;
}

#mensaje {
  font-size: 12px;
  color: #8df1f8;
  margin: 6px 0;
  min-height: 16px;
}

.controles {
  flex-shrink: 0;
  width: 100%;
  padding-bottom: 5px;
}

button {
  border: 1px solid #ff4bc9;
  border-radius: 20px;
  background: #3b174e;
  color: white;
  font-weight: bold;
  padding: 11px 17px;
  margin: 3px;
  cursor: pointer;
}

button:disabled { opacity: .45; }

.principal {
  background: #ff36b9;
  color: #16051b;
}

.oculto { display: none !important; }

#menu, #qrVista {
  width: 100%;
  max-width: 360px;
  margin: auto;
  padding: 20px;
  border: 2px solid #ff36b9;
  border-radius: 18px;
  background: #24102f;
}

#menu h2, #qrVista h2 {
  font-size: 21px;
}

#menu button {
  display: block;
  width: 100%;
  margin: 12px auto;
}

#qrVista {
  text-align: center;
}

#qrVista p {
  font-size: 14px;
  line-height: 1.5;
}

#qrIcono {
  font-size: 65px;
  margin: 20px 0;
}

#video {
  display: none;
}
</style>
</head>

<body>

<div class="app">
  <h1>NaLu's 35</h1>
  <p class="subtitulo">PHOTOBOOTH · 18.12.2026</p>

  <section id="menu">
    <h2>Elige tu fotografía</h2>
    <button onclick="elegir('individual')">
      1 FOTOGRAFÍA
    </button>
    <button onclick="elegir('cuatro')">
      4 FOTOGRAFÍAS
    </button>
  </section>

  <div id="escenario" class="oculto">
    <canvas id="lienzo"></canvas>
    <div id="cuenta"></div>
  </div>

  <section id="qrVista" class="oculto">
    <h2>¡Tu fotografía está lista!</h2>
    <div id="qrIcono">▦</div>
    <p>
      Aquí aparecerá el código QR para descargar
      tu fotografía cuando activemos Google Drive.
    </p>
    <button onclick="descargar()" class="principal">
      Descargar fotografía
    </button>
  </section>

  <p id="mensaje"></p>

  <div class="controles">
    <div id="controlesCamara" class="oculto">
      <button id="tomar" class="principal"
              onclick="tomarFotos()">
        TOMAR FOTO
      </button>
      <button onclick="reiniciar()">Volver</button>
    </div>

    <div id="controlesFoto" class="oculto">
      <button onclick="mostrarQR()" class="principal">
        Siguiente ›
      </button>
      <button onclick="reiniciar()">Repetir</button>
    </div>

    <div id="controlesQR" class="oculto">
      <button onclick="reiniciar()" class="principal">
        Nueva fotografía
      </button>
    </div>
  </div>

  <video id="video" autoplay muted playsinline></video>
</div>

<script>
const video = document.getElementById("video");
const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d");
const mensaje = document.getElementById("mensaje");
const cuenta = document.getElementById("cuenta");

let modo = "individual";
let marco = null;
let camara = null;
let capturas = [];
let fase = "menu";
let ocupado = false;
let sesion = 0;
let archivoFinal = null;

// Posiciones relativas a cada marco.
// Se pueden ajustar si fuera necesario.
const zonas = {
  individual: [
    [.085, .18, .83, .64]
  ],
  cuatro: [
    [.080, .166, .390, .305],
    [.530, .166, .390, .305],
    [.080, .515, .390, .305],
    [.530, .515, .390, .305]
  ]
};

function visible(id, si) {
  document.getElementById(id)
    .classList.toggle("oculto", !si);
}

function controles(nombre) {
  visible("controlesCamara", nombre === "camara");
  visible("controlesFoto", nombre === "foto");
  visible("controlesQR", nombre === "qr");
}

function cargarMarco(ruta) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(
      new Error("No se encontró el marco: " + ruta)
    );
    img.src = ruta + "?v=5";
  });
}

function detenerCamara() {
  if (camara) {
    camara.getTracks().forEach(t => t.stop());
    camara = null;
  }
  video.srcObject = null;
}

async function elegir(tipo) {
  const actual = ++sesion;

  modo = tipo;
  capturas = [];
  archivoFinal = null;
  ocupado = false;
  fase = "cargando";

  visible("menu", false);
  visible("escenario", true);
  visible("qrVista", false);
  controles("");
  mensaje.textContent = "Preparando cámara...";

  try {
    marco = await cargarMarco(
      tipo === "individual"
        ? "marco-individual.png"
        : "marco-cuatro.png"
    );

    if (actual !== sesion) return;

    lienzo.width = marco.naturalWidth;
    lienzo.height = marco.naturalHeight;

    camara = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    if (actual !== sesion) {
      detenerCamara();
      return;
    }

    video.srcObject = camara;
    await video.play();

    if (actual !== sesion) return;

    fase = "camara";
    controles("camara");
    mensaje.textContent = "¡Ubícate dentro del marco!";

  } catch (error) {
    mensaje.textContent =
      "No se pudo iniciar: " + error.message;
    console.error(error);
    controles("");
  }
}

function dibujarFoto(foto, zona) {
  if (!foto || !foto.width || !foto.height) return;

  const [px, py, pw, ph] = zona;

  const x = px * lienzo.width;
  const y = py * lienzo.height;
  const w = pw * lienzo.width;
  const h = ph * lienzo.height;

  const iw = foto.width;
  const ih = foto.height;

  const escala = Math.max(w / iw, h / ih);
  const sw = w / escala;
  const sh = h / escala;
  const sx = (iw - sw) / 2;
  const sy = (ih - sh) / 2;

  ctx.save();

  // Efecto espejo y filtro vintage.
  ctx.translate(x + w, y);
  ctx.scale(-1, 1);
  ctx.filter = "sepia(25%) contrast(108%) saturate(85%)";

  ctx.drawImage(
    foto,
    sx, sy, sw, sh,
    0, 0, w, h
  );

  ctx.restore();
}

function dibujarEscena() {
  if (!marco || !lienzo.width) return;

  ctx.clearRect(0, 0, lienzo.width, lienzo.height);
  ctx.fillStyle = "#100719";
  ctx.fillRect(0, 0, lienzo.width, lienzo.height);

  const espacios = zonas[modo];

  espacios.forEach((zona, i) => {
    if (capturas[i]) {
      dibujarFoto(capturas[i], zona);
    } else if (fase === "camara" &&
               video.readyState >= 2) {
      dibujarFoto(video, zona);
    }
  });

  // Marco por encima de la cámara y las fotos.
  ctx.drawImage(
    marco, 0, 0, lienzo.width, lienzo.height
  );
}

function animar() {
  if (fase === "camara" || fase === "foto") {
    dibujarEscena();
  }
  requestAnimationFrame(animar);
}
requestAnimationFrame(animar);

function esperar(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function contar(actual) {
  for (let n = 3; n >= 1; n--) {
    if (actual !== sesion) return false;
    cuenta.textContent = n;
    await esperar(1000);
  }

  if (actual !== sesion) return false;

  cuenta.textContent = "";
  return true;
}

function capturarFotograma() {
  const copia = document.createElement("canvas");
  copia.width = video.videoWidth;
  copia.height = video.videoHeight;

  copia.getContext("2d").drawImage(
    video, 0, 0, copia.width, copia.height
  );

  return copia;
}

async function tomarFotos() {
  if (ocupado || fase !== "camara") return;

  ocupado = true;
  const actual = sesion;
  const total = modo === "individual" ? 1 : 4;

  document.getElementById("tomar").disabled = true;

  try {
    for (let i = 0; i < total; i++) {
      if (actual !== sesion) return;

      mensaje.textContent =
        "Fotografía " + (i + 1) + " de " + total;

      const continuar = await contar(actual);
      if (!continuar) return;

      capturas.push(capturarFotograma());

      if (i < total - 1) {
        mensaje.textContent = "¡Cambia de pose!";
        await esperar(650);
      }
    }

    if (actual !== sesion) return;

    // Congelamos el resultado en el mismo lienzo.
    fase = "foto";
    dibujarEscena();

    archivoFinal = lienzo.toDataURL(
      "image/jpeg", .92
    );

    detenerCamara();
    controles("foto");
    mensaje.textContent = "¡Así quedó tu fotografía!";

  } catch (error) {
    mensaje.textContent = error.message;
    console.error(error);
  } finally {
    ocupado = false;
    document.getElementById("tomar").disabled = false;
  }
}

function mostrarQR() {
  if (!archivoFinal) return;

  fase = "qr";
  visible("escenario", false);
  visible("qrVista", true);
  controles("qr");
  mensaje.textContent =
    "El QR se activará al conectar Google Drive.";
}

function descargar() {
  if (!archivoFinal) return;

  const a = document.createElement("a");
  a.href = archivoFinal;
  a.download =
    "NaLu35_" + modo + "_" + Date.now() + ".jpg";

  document.body.appendChild(a);
  a.click();
  a.remove();
}

function reiniciar() {
  sesion++;
  fase = "menu";
  ocupado = false;
  marco = null;
  capturas = [];
  archivoFinal = null;

  detenerCamara();

  cuenta.textContent = "";
  mensaje.textContent = "";

  visible("escenario", false);
  visible("qrVista", false);
  visible("menu", true);
  controles("");
}
</script>

</body>
</html>
