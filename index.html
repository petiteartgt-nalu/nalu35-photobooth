
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100719">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NaLu 35">
<title>NaLu's 35</title>

<link href="https://fonts.googleapis.com/css2?family=Righteous&family=Modak&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #100719;
  color: white;
  font-family: Righteous, cursive;
  text-align: center;
}

.app {
  height: 100vh;
  height: 100dvh;
  max-width: 560px;
  margin: auto;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}

h1 {
  margin: 3px 0 1px;
  color: #ff38be;
  font-size: 26px;
  text-shadow: 0 0 13px #ff0099;
}

.sub {
  margin: 0 0 8px;
  font-family: Modak, cursive;
  font-size: 22px;
  letter-spacing: 2px;
  color: #79eaf5;
  text-shadow: 0 0 8px #00c8e8;
}

#escenario {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#lienzo {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 5px;
}

#superposicion {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

#tomar {
  pointer-events: auto;
  background: #ff36b9;
  color: #190721;
  box-shadow: 0 0 15px #ff35bd, 0 0 32px #ff35bd;
  border: 2px solid white;
  font-size: 20px;
  padding: 17px 25px;
}

#cuenta {
  font-size: clamp(72px, 18vw, 110px);
  color: white;
  text-shadow: 0 0 12px #ff00c8, 0 0 30px #ff00c8;
  max-width: 100%;
  padding: 0 8px;
}

#cuenta.pose {
  font-size: clamp(24px, 6vw, 43px);
}

#mensaje {
  min-height: 18px;
  margin: 7px 0;
  color: #89f1f7;
  font-size: 12px;
}

button, .botonDescarga {
  font-family: Righteous, cursive;
  background: #38174b;
  color: white;
  border: 1px solid #ff4bc9;
  border-radius: 30px;
  padding: 11px 18px;
  font-size: 14px;
  cursor: pointer;
}

.principal {
  background: #ff36b9;
  color: #190721;
}

.oculto { display: none !important; }

#menu, #qrVista, #gifVista {
  width: 100%;
  max-width: 370px;
  margin: auto;
  padding: 20px;
  border: 2px solid #ff36b9;
  border-radius: 18px;
  background: #24102f;
}

#menu button {
  display: block;
  width: 100%;
  margin: 13px auto;
}

#qrVista, #gifVista {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

#qrVista h2, #gifVista h2 {
  margin: 0;
  color: #ff61ce;
  font-size: 22px;
}

#qrVista p, #gifVista p {
  font-size: 13px;
  line-height: 1.45;
  margin: 0;
}

#qrImagen {
  display: block;
  width: min(65vw, 230px);
  height: auto;
  background: white;
  padding: 8px;
  border-radius: 6px;
}

#qrEstado, #gifEstado {
  color: #8ceaf4;
  font-size: 13px;
}

#video {
  position: fixed;
  left: -9999px;
  top: 0;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

#qrEnlace {
  color: #8ceaf4;
  font-size: 12px;
  overflow-wrap: anywhere;
}

#gifImagen {
  display: block;
  max-width: 100%;
  max-height: 48vh;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 6px;
}

.botonDescarga {
  display: inline-block;
  text-decoration: none;
  background: #ff36b9;
  color: #190721;
}

#gifVista button { width: 100%; }

.nota {
  color: #d6b5df;
  font-size: 11px !important;
}

@media (max-height: 650px) {
  #menu, #qrVista, #gifVista {
    padding: 12px;
    gap: 8px;
  }

  #menu button { margin: 8px auto; }
  #gifImagen { max-height: 38vh; }
}
</style>
</head>

<body>
<div class="app">

  <h1>NaLu's 35</h1>
  <p class="sub">18.12.2026</p>

  <section id="menu">
    <h2>Elige tu fotografía</h2>
    <button onclick="elegir('individual')">1 FOTOGRAFÍA</button>
    <button onclick="elegir('cuatro')">4 FOTOGRAFÍAS</button>
    <button class="principal" onclick="elegir('gif')">GIF ANIMADO</button>
  </section>

  <div id="escenario" class="oculto">
    <canvas id="lienzo"></canvas>
    <div id="superposicion">
      <button id="tomar" class="principal oculto" onclick="tomarFotos()">
        TOMAR FOTO
      </button>
      <div id="cuenta"></div>
    </div>
  </div>

  <section id="qrVista" class="oculto">
    <h2>¡Tu foto está lista!</h2>
    <div id="qrEstado">Preparando QR...</div>
    <img id="qrImagen" class="oculto" alt="Código QR de la fotografía">
    <a id="qrEnlace" class="oculto" target="_blank" rel="noopener">
      Abrir fotografía
    </a>
    <p>Escanea el QR para abrir y descargar tu fotografía.</p>
    <button class="principal" onclick="reiniciar()">SIGUIENTE</button>
  </section>

  <section id="gifVista" class="oculto">
    <h2>¡Tu GIF está listo!</h2>
    <div id="gifEstado">Preparando animación...</div>
    <img id="gifImagen" class="oculto" alt="GIF animado de NaLu's 35">
    <a id="gifDescarga" class="botonDescarga oculto"
       download="NaLu35_animado.gif">
      DESCARGAR GIF
    </a>
    <p class="nota">
      Versión de prueba: el GIF se descarga directamente,
      todavía sin Google Drive.
    </p>
    <button class="principal" onclick="reiniciar()">SIGUIENTE</button>
  </section>

  <p id="mensaje"></p>
  <video id="video" autoplay muted playsinline></video>
</div>

<iframe id="envioFrame" name="envioFrame" style="display:none"
        title="Guardado de fotografía"></iframe>

<form id="envioForm" method="POST" target="envioFrame"
      style="display:none">
  <input name="foto" id="campoFoto">
  <input name="token" id="campoToken">
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

<script>
const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbyYM2_azshTL_-Y4Ad3QPzl33j-Mpy7lX_AfWSnv8OH0sN_9CkIse1ARFfgTFL9o_aJ7Q/exec';

const GIF_WORKER_URL =
  'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';

const video = document.getElementById('video');
const lienzo = document.getElementById('lienzo');
const ctx = lienzo.getContext('2d');
const mensaje = document.getElementById('mensaje');
const cuenta = document.getElementById('cuenta');

const zonas = {
  individual: [[.085, .18, .83, .64]],
  cuatro: [
    [.080, .166, .390, .305],
    [.530, .166, .390, .305],
    [.080, .515, .390, .305],
    [.530, .515, .390, .305]
  ]
};

let modo = 'individual';
let marco = null;
let camara = null;
let capturas = [];
let fase = 'menu';
let sesion = 0;
let ocupado = false;
let archivoFinal = null;
let tokenActual = null;
let guardado = null;
let temporizadorQR = null;
let temporizadorConsulta = null;
let consultas = 0;
let envioRealizado = false;
let gifURL = null;
let gifEnProceso = null;

function visible(id, si) {
  document.getElementById(id).classList.toggle('oculto', !si);
}

function esperar(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function cargarMarco(ruta) {
  return new Promise((ok, fail) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = () => fail(new Error('No se encontró ' + ruta));
    img.src = ruta + '?v=18';
  });
}

function detenerCamara() {
  if (camara) {
    camara.getTracks().forEach(t => t.stop());
    camara = null;
  }
  video.pause();
  video.srcObject = null;
}

function cancelarTiempo() {
  clearTimeout(temporizadorQR);
  clearTimeout(temporizadorConsulta);
  temporizadorQR = null;
  temporizadorConsulta = null;
}

function limpiarGIF() {
  if (gifEnProceso) {
    try { gifEnProceso.abort(); } catch (e) {}
    gifEnProceso = null;
  }

  if (gifURL) {
    URL.revokeObjectURL(gifURL);
    gifURL = null;
  }

  document.getElementById('gifImagen').removeAttribute('src');
  document.getElementById('gifDescarga').removeAttribute('href');
  visible('gifImagen', false);
  visible('gifDescarga', false);
}

async function elegir(tipo) {
  const actual = ++sesion;
  cancelarTiempo();
  detenerCamara();
  limpiarGIF();

  modo = tipo;
  marco = null;
  capturas = [];
  archivoFinal = null;
  tokenActual = null;
  guardado = null;
  envioRealizado = false;
  consultas = 0;
  ocupado = false;
  fase = 'cargando';
  cuenta.textContent = '';

  visible('menu', false);
  visible('qrVista', false);
  visible('gifVista', false);
  visible('escenario', true);
  visible('tomar', false);
  mensaje.textContent = 'Preparando cámara...';

  try {
    const nuevoMarco = await cargarMarco(
      tipo === 'cuatro' ? 'marco-cuatro.png' : 'marco-individual.png'
    );

    if (actual !== sesion) return;
    marco = nuevoMarco;

    if (tipo === 'cuatro') {
      const zona = zonas.cuatro[0];
      lienzo.width = Math.round(marco.naturalWidth * zona[2]);
      lienzo.height = Math.round(marco.naturalHeight * zona[3]);
    } else {
      lienzo.width = marco.naturalWidth;
      lienzo.height = marco.naturalHeight;
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: 'user',
        width: { ideal: 1280 },
        height: { ideal: 960 }
      }
    });

    if (actual !== sesion) {
      stream.getTracks().forEach(t => t.stop());
      return;
    }

    camara = stream;
    video.srcObject = stream;
    await video.play();

    if (actual !== sesion) return;
    fase = 'camara';
    visible('tomar', true);

    mensaje.textContent =
      tipo === 'gif'
        ? '¡Prepárate para 6 poses diferentes!'
        : tipo === 'individual'
          ? '¡Ubícate dentro del marco!'
          : '¡Ubícate dentro del encuadre!';

  } catch (err) {
    mensaje.textContent = 'No se pudo iniciar la cámara: ' + err.message;
    console.error(err);
  }
}

function dibujarFotoEn(contexto, foto, x, y, w, h) {
  const iw = foto.videoWidth || foto.width;
  const ih = foto.videoHeight || foto.height;
  if (!iw || !ih) return;

  const escala = Math.max(w / iw, h / ih);
  const sw = w / escala;
  const sh = h / escala;
  const sx = (iw - sw) / 2;
  const sy = (ih - sh) / 2;

  contexto.save();
  contexto.translate(x + w, y);
  contexto.scale(-1, 1);
  contexto.filter = 'sepia(25%) contrast(108%) saturate(85%)';
  contexto.drawImage(foto, sx, sy, sw, sh, 0, 0, w, h);
  contexto.restore();
}

function dibujarFoto(foto, x, y, w, h) {
  dibujarFotoEn(ctx, foto, x, y, w, h);
}

function dibujarZona(foto, zona) {
  const [x, y, w, h] = zona;
  dibujarFoto(
    foto,
    x * lienzo.width,
    y * lienzo.height,
    w * lienzo.width,
    h * lienzo.height
  );
}

function dibujarCamara() {
  if (!lienzo.width) return;

  ctx.clearRect(0, 0, lienzo.width, lienzo.height);
  ctx.fillStyle = '#100719';
  ctx.fillRect(0, 0, lienzo.width, lienzo.height);

  if (modo === 'cuatro') {
    if (video.readyState >= 2) {
      dibujarFoto(video, 0, 0, lienzo.width, lienzo.height);
    }
  } else {
    if (video.readyState >= 2) {
      dibujarZona(video, zonas.individual[0]);
    }
    if (marco) {
      ctx.drawImage(marco, 0, 0, lienzo.width, lienzo.height);
    }
  }
}

function animar() {
  if (fase === 'camara') dibujarCamara();
  requestAnimationFrame(animar);
}
requestAnimationFrame(animar);

async function contar(actual, cambio) {
  cuenta.classList.add('pose');
  cuenta.textContent = cambio ? '¡CAMBIA DE POSE!' : '¡PREPÁRATE!';
  await esperar(1000);

  if (actual !== sesion) return false;
  cuenta.classList.remove('pose');

  const inicio = modo === 'gif' ? 2 : 3;

  for (let n = inicio; n >= 1; n--) {
    if (actual !== sesion) return false;
    cuenta.textContent = n;
    await esperar(1000);
  }

  if (actual !== sesion) return false;
  cuenta.textContent = '';
  return true;
}

function capturar() {
  if (!video.videoWidth || !video.videoHeight) {
    throw new Error('La cámara todavía no está lista.');
  }

  const copia = document.createElement('canvas');
  copia.width = video.videoWidth;
  copia.height = video.videoHeight;
  copia.getContext('2d').drawImage(
    video, 0, 0, copia.width, copia.height
  );
  return copia;
}

function componer() {
  lienzo.width = marco.naturalWidth;
  lienzo.height = marco.naturalHeight;
  ctx.fillStyle = '#100719';
  ctx.fillRect(0, 0, lienzo.width, lienzo.height);

  zonas[modo].forEach((zona, i) => {
    if (capturas[i]) dibujarZona(capturas[i], zona);
  });

  ctx.drawImage(marco, 0, 0, lienzo.width, lienzo.height);
}

async function tomarFotos() {
  if (ocupado || fase !== 'camara') return;
  ocupado = true;
  visible('tomar', false);

  const actual = sesion;
  const total = modo === 'gif' ? 6 : modo === 'individual' ? 1 : 4;

  try {
    for (let i = 0; i < total; i++) {
      if (actual !== sesion) return;

      mensaje.textContent = 'Fotografía ' + (i + 1) + ' de ' + total;
      const ok = await contar(actual, i > 0);
      if (!ok) return;
      capturas.push(capturar());
    }

    if (actual !== sesion) return;
    detenerCamara();

    if (modo === 'gif') {
      fase = 'generando-gif';
      visible('escenario', false);
      visible('gifVista', true);
      mensaje.textContent = '';
      await crearGIF(actual);
      return;
    }

    fase = 'resultado';
    componer();
    archivoFinal = lienzo.toDataURL('image/jpeg', .82);
    mensaje.textContent = '¡Así quedó tu fotografía!';
    iniciarGuardado();

    temporizadorQR = setTimeout(() => {
      if (actual === sesion && fase === 'resultado') pasarAQR();
    }, 5000);

  } catch (err) {
    console.error(err);

    if (actual === sesion) {
      mensaje.textContent = err.message;

      if (modo === 'gif') {
        document.getElementById('gifEstado').textContent =
          'No se pudo crear el GIF: ' + err.message;
        visible('gifVista', true);
      } else {
        visible('tomar', true);
      }
    }
  } finally {
    ocupado = false;
  }
}

async function obtenerWorkerGIF() {
  const respuesta = await fetch(GIF_WORKER_URL);
  if (!respuesta.ok) {
    throw new Error('No se pudo cargar el generador de GIF.');
  }
  const codigo = await respuesta.text();
  return URL.createObjectURL(
    new Blob([codigo], { type: 'text/javascript' })
  );
}

async function crearGIF(actual) {
  const estado = document.getElementById('gifEstado');
  estado.textContent = 'Preparando tus 6 fotografías...';

  if (typeof GIF === 'undefined') {
    throw new Error(
      'No se cargó la biblioteca de animaciones. Comprueba internet.'
    );
  }

  let workerURL = null;

  try {
    workerURL = await obtenerWorkerGIF();
    if (actual !== sesion) return;

    const ancho = 480;
    const alto = Math.round(
      ancho * marco.naturalHeight / marco.naturalWidth
    );

    const gif = new GIF({
      workers: 2,
      quality: 12,
      width: ancho,
      height: alto,
      repeat: 0,
      workerScript: workerURL,
      background: '#100719'
    });

    gifEnProceso = gif;
    const zona = zonas.individual[0];

    /*
      6 fotografías originales.
      Cada una aparece 1 segundo.
      Repetimos la secuencia 3 veces.
      Total: 18 segundos por ciclo.
    */
    for (let vuelta = 0; vuelta < 3; vuelta++) {
      for (let i = 0; i < 6; i++) {
        if (actual !== sesion) return;

        const cuadro = document.createElement('canvas');
        cuadro.width = ancho;
        cuadro.height = alto;

        const c = cuadro.getContext('2d');
        c.fillStyle = '#100719';
        c.fillRect(0, 0, ancho, alto);

        dibujarFotoEn(
          c,
          capturas[i],
          zona[0] * ancho,
          zona[1] * alto,
          zona[2] * ancho,
          zona[3] * alto
        );

        c.drawImage(marco, 0, 0, ancho, alto);

        gif.addFrame(cuadro, {
          copy: true,
          delay: 1000
        });

        estado.textContent =
          'Preparando vuelta ' + (vuelta + 1) +
          ' de 3, foto ' + (i + 1) + ' de 6...';
      }
    }

    const blob = await new Promise((resolver, rechazar) => {
      gif.on('progress', progreso => {
        if (actual !== sesion) return;
        estado.textContent =
          'Creando GIF... ' + Math.round(progreso * 100) + '%';
      });

      gif.on('finished', resolver);
      gif.on('abort', () => {
        rechazar(new Error('Generación cancelada.'));
      });

      try {
        gif.render();
      } catch (error) {
        rechazar(error);
      }
    });

    if (actual !== sesion) return;

    gifURL = URL.createObjectURL(blob);

    const img = document.getElementById('gifImagen');
    const descarga = document.getElementById('gifDescarga');

    img.src = gifURL;
    descarga.href = gifURL;

    visible('gifImagen', true);
    visible('gifDescarga', true);

    estado.textContent = '¡Listo! Tu GIF tiene 3 vueltas animadas.';
    fase = 'gif-listo';

  } finally {
    gifEnProceso = null;
    if (workerURL) URL.revokeObjectURL(workerURL);
  }
}

function generarToken() {
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  return Array.from(
    bytes,
    b => b.toString(16).padStart(2, '0')
  ).join('');
}

function iniciarGuardado() {
  if (!archivoFinal || envioRealizado) return;

  envioRealizado = true;
  tokenActual = generarToken();
  consultas = 0;

  document.getElementById('envioForm').action = APPS_SCRIPT_URL;
  document.getElementById('campoFoto').value =
    archivoFinal.split(',')[1];
  document.getElementById('campoToken').value = tokenActual;

  document.getElementById('envioForm').submit();
  consultarGuardado();
}

function consultarGuardado() {
  if (!tokenActual || guardado) return;

  if (consultas >= 30) {
    guardado = {
      ok: false,
      mensaje: 'No se pudo confirmar el guardado. Revisa Google Drive.'
    };
    if (fase === 'qr') actualizarQR();
    return;
  }

  consultas++;

  const tokenConsultado = tokenActual;
  const callback = 'naluRespuesta_' + consultas;
  const script = document.createElement('script');
  let respondio = false;

  window[callback] = function(resultado) {
    if (respondio) return;
    respondio = true;
    script.remove();
    delete window[callback];

    if (tokenConsultado !== tokenActual) return;

    if (resultado.pendiente) {
      temporizadorConsulta = setTimeout(consultarGuardado, 1000);
    } else {
      guardado = resultado;
      document.getElementById('campoFoto').value = '';
      if (fase === 'qr') actualizarQR();
    }
  };

  script.onerror = function() {
    if (respondio) return;
    respondio = true;
    script.remove();
    delete window[callback];

    if (tokenConsultado !== tokenActual) return;
    temporizadorConsulta = setTimeout(consultarGuardado, 1500);
  };

  script.src =
    APPS_SCRIPT_URL +
    '?token=' + encodeURIComponent(tokenConsultado) +
    '&callback=' + encodeURIComponent(callback) +
    '&t=' + Date.now();

  document.head.appendChild(script);
}

function pasarAQR() {
  if (!archivoFinal) return;
  clearTimeout(temporizadorQR);
  fase = 'qr';
  visible('escenario', false);
  visible('qrVista', true);
  mensaje.textContent = '';
  actualizarQR();
}

function actualizarQR() {
  const estado = document.getElementById('qrEstado');
  const img = document.getElementById('qrImagen');
  const link = document.getElementById('qrEnlace');

  visible('qrImagen', false);
  visible('qrEnlace', false);

  if (guardado && guardado.ok && guardado.url) {
    estado.textContent = '¡Fotografía guardada! Escanea tu QR.';

    img.src =
      'https://api.qrserver.com/v1/create-qr-code/' +
      '?size=350x350&data=' +
      encodeURIComponent(guardado.url);

    visible('qrImagen', true);
    link.href = guardado.url;
    link.textContent = 'Abrir fotografía en Drive';
    visible('qrEnlace', true);

  } else if (guardado && !guardado.ok) {
    estado.textContent =
      'No se pudo confirmar la fotografía: ' + guardado.mensaje;
  } else {
    estado.textContent = 'Preparando tu código QR...';
  }
}

function reiniciar() {
  ++sesion;
  cancelarTiempo();
  detenerCamara();
  limpiarGIF();

  fase = 'menu';
  ocupado = false;
  marco = null;
  capturas = [];
