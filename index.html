
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NaLu's 35 Photobooth</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Righteous&display=swap');

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #100719;
  color: white;
  font-family: 'Righteous', cursive;
}

body {
  text-align: center;
}

.app {
  width: 100%;
  max-width: 540px;
  height: 100vh;
  height: 100dvh;
  margin: auto;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}

h1 {
  margin: 4px 0 2px;
  font-size: 26px;
  color: #ff38be;
  text-shadow: 0 0 12px #ff0099;
}

.subtitulo {
  margin: 0 0 8px;
  color: #76edfa;
  font-size: 11px;
  letter-spacing: 2px;
}

#escenario {
  position: relative;
  flex: 1;
  min-height: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#lienzo {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 6px;
}

#cuenta {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
  font-family: 'Righteous', cursive;
  font-size: 95px;
  color: white;
  text-align: center;
  line-height: 1.1;
  text-shadow:
    0 0 12px #ff00c8,
    0 0 28px #ff00c8,
    0 0 45px #ff00c8;
  pointer-events: none;
}

#mensaje {
  min-height: 18px;
  margin: 6px 0;
  color: #8df1f8;
  font-size: 12px;
}

.controles {
  flex-shrink: 0;
  width: 100%;
  padding-bottom: 5px;
}

button {
  font-family: 'Righteous', cursive;
  font-size: 14px;
  color: white;
  background: #3b174e;
  border: 1px solid #ff4bc9;
  border-radius: 20px;
  padding: 11px 17px;
  margin: 3px;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
}

.principal {
  background: #ff36b9;
  color: #16051b;
}

.oculto {
  display: none !important;
}

#menu, #qrVista {
  width: 100%;
  max-width: 360px;
  margin: auto;
  padding: 20px;
  border: 2px solid #ff36b9;
  border-radius: 18px;
  background: #24102f;
}

#menu h2, #qrVista h2 {
  font-size: 21px;
}

#menu button {
  display: block;
  width: 100%;
  margin: 12px auto;
}

#qrVista p {
  font-size: 14px;
  line-height: 1.5;
}

#qrIcono {
  font-size: 65px;
  margin: 20px 0;
}

#video {
  position: fixed;
  left: -9999px;
  top: 0;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<div class="app">

  <h1>NaLu's 35</h1>
  <p class="subtitulo">
    PHOTOBOOTH · 18.12.2026
  </p>

  <section id="menu">
    <h2>Elige tu fotografía</h2>

    <button onclick="elegir('individual')">
      1 FOTOGRAFÍA
    </button>

    <button onclick="elegir('cuatro')">
      4 FOTOGRAFÍAS
    </button>
  </section>

  <div id="escenario" class="oculto">
    <canvas id="lienzo"></canvas>
    <div id="cuenta"></div>
  </div>

  <section id="qrVista" class="oculto">
    <h2>¡Tu fotografía está lista!</h2>

    <div id="qrIcono">▦</div>

    <p>
      Aquí aparecerá el código QR cuando
      conectemos Google Drive.
    </p>

    <button class="principal" onclick="descargar()">
      Descargar fotografía
    </button>
  </section>

  <p id="mensaje"></p>

  <div class="controles">

    <div id="controlesCamara" class="oculto">
      <button id="tomar"
              class="principal"
              onclick="tomarFotos()">
        TOMAR FOTO
      </button>

      <button onclick="reiniciar()">
        Volver
      </button>
    </div>

    <div id="controlesFoto" class="oculto">
      <button class="principal" onclick="mostrarQR()">
        Siguiente ›
      </button>

      <button onclick="reiniciar()">
        Repetir
      </button>
    </div>

    <div id="controlesQR" class="oculto">
      <button class="principal" onclick="reiniciar()">
        Nueva fotografía
      </button>
    </div>

  </div>

  <video id="video" autoplay muted playsinline></video>

</div>

<script>
const video = document.getElementById("video");
const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d");
const mensaje = document.getElementById("mensaje");
const cuenta = document.getElementById("cuenta");

let modo = "individual";
let marco = null;
let camara = null;
let capturas = [];
let fase = "menu";
let ocupado = false;
let sesion = 0;
let archivoFinal = null;

const zonas = {
  individual: [
    [.085, .18, .83, .64]
  ],
  cuatro: [
    [.080, .166, .390, .305],
    [.530, .166, .390, .305],
    [.080, .515, .390, .305],
    [.530, .515, .390, .305]
  ]
};

function visible(id, mostrar) {
  document.getElementById(id)
    .classList.toggle("oculto", !mostrar);
}

function controles(nombre) {
  visible("controlesCamara", nombre === "camara");
  visible("controlesFoto", nombre === "foto");
  visible("controlesQR", nombre === "qr");
}

function cargarMarco(ruta) {
  return new Promise((resolve, reject) => {
    const img = new Image();

    img.onload = () => resolve(img);

    img.onerror = () => reject(
      new Error("No se encontró " + ruta)
    );

    img.src = ruta + "?v=9";
  });
}

function detenerCamara() {
  if (camara) {
    camara.getTracks().forEach(t => t.stop());
    camara = null;
  }

  video.pause();
  video.srcObject = null;
}

async function elegir(tipo) {
  const actual = ++sesion;

  detenerCamara();

  modo = tipo;
  capturas = [];
  archivoFinal = null;
  ocupado = false;
  fase = "cargando";
  marco = null;

  visible("menu", false);
  visible("escenario", true);
  visible("qrVista", false);
  controles("");

  mensaje.textContent = "Preparando cámara...";

  try {
    marco = await cargarMarco(
      tipo === "individual"
        ? "marco-individual.png"
        : "marco-cuatro.png"
    );

    if (actual !== sesion) return;

    // Individual: formato del marco.
    // Cuatro: vista amplia de cámara.
    if (tipo === "individual") {
      lienzo.width = marco.naturalWidth;
      lienzo.height = marco.naturalHeight;
    } else {
      lienzo.width = 1280;
      lienzo.height = 960;
    }

    const nuevaCamara =
      await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 960 }
        }
      });

    if (actual !== sesion) {
      nuevaCamara.getTracks().forEach(t => t.stop());
      return;
    }

    camara = nuevaCamara;
    video.srcObject = camara;

    await video.play();

    if (actual !== sesion) return;

    fase = "camara";
    controles("camara");

    mensaje.textContent =
      tipo === "individual"
        ? "¡Ubícate dentro del marco!"
        : "¡Prepárate para tus 4 poses!";

  } catch (error) {
    mensaje.textContent =
      "No se pudo iniciar: " + error.message;

    console.error(error);
    controles("");
  }
}

function dibujarFoto(foto, x, y, w, h) {
  const iw = foto.videoWidth || foto.width;
  const ih = foto.videoHeight || foto.height;

  if (!iw || !ih) return;

  const escala = Math.max(w / iw, h / ih);
  const sw = w / escala;
  const sh = h / escala;
  const sx = (iw - sw) / 2;
  const sy = (ih - sh) / 2;

  ctx.save();

  // Efecto espejo.
  ctx.translate(x + w, y);
  ctx.scale(-1, 1);

  // Filtro vintage.
  ctx.filter =
    "sepia(25%) contrast(108%) saturate(85%)";

  ctx.drawImage(
    foto,
    sx, sy, sw, sh,
    0, 0, w, h
  );

  ctx.restore();
}

function dibujarEscena() {
  if (!lienzo.width) return;

  ctx.clearRect(
    0, 0,
    lienzo.width, lienzo.height
  );

  ctx.fillStyle = "#100719";
  ctx.fillRect(
    0, 0,
    lienzo.width, lienzo.height
  );

  // MODO INDIVIDUAL:
  // cámara dentro del marco.
  if (modo === "individual") {

    if (capturas[0]) {
      dibujarZona(capturas[0], zonas.individual[0]);

    } else if (
      fase === "camara" &&
      video.readyState >= 2
    ) {
      dibujarZona(video, zonas.individual[0]);
    }

    if (marco) {
      ctx.drawImage(
        marco, 0, 0,
        lienzo.width, lienzo.height
      );
    }

  } else if (modo === "cuatro") {

    // MODO CUATRO:
    // cámara grande, sin marco ni divisiones.
    if (
      fase === "camara" &&
      video.readyState >= 2
    ) {
      dibujarFoto(
        video,
        0, 0,
        lienzo.width, lienzo.height
      );
    }
  }
}

function dibujarZona(foto, zona) {
  const [px, py, pw, ph] = zona;

  dibujarFoto(
    foto,
    px * lienzo.width,
    py * lienzo.height,
    pw * lienzo.width,
    ph * lienzo.height
  );
}

function animar() {
  if (fase === "camara") {
    dibujarEscena();
  }

  requestAnimationFrame(animar);
}

requestAnimationFrame(animar);

function esperar(ms) {
  return new Promise(resolve =>
    setTimeout(resolve, ms)
  );
}

async function contar(actual, cambioDePose = false) {

  if (cambioDePose) {
    cuenta.style.fontSize =
      "clamp(35px, 8vw, 65px)";

    cuenta.textContent = "¡CAMBIA DE POSE!";

    await esperar(1000);

    if (actual !== sesion) return false;
  }

  cuenta.style.fontSize = "95px";

  for (let n = 4; n >= 1; n--) {
    if (actual !== sesion) return false;

    cuenta.textContent = n;
    await esperar(1000);
  }

  if (actual !== sesion) return false;

  cuenta.textContent = "";
  return true;
}

function capturarFotograma() {
  if (!video.videoWidth || !video.videoHeight) {
    throw new Error("La cámara todavía no está lista.");
  }

  const copia = document.createElement("canvas");

  copia.width = video.videoWidth;
  copia.height = video.videoHeight;

  copia.getContext("2d").drawImage(
    video,
    0, 0,
    copia.width,
    copia.height
  );

  return copia;
}

function crearComposicionFinal() {
  // Para las cuatro fotos cambiamos el lienzo
  // al tamaño real del marco.
  lienzo.width = marco.naturalWidth;
  lienzo.height = marco.naturalHeight;

  ctx.clearRect(
    0, 0,
    lienzo.width, lienzo.height
  );

  ctx.fillStyle = "#100719";
  ctx.fillRect(
    0, 0,
    lienzo.width, lienzo.height
  );

  zonas[modo].forEach((zona, i) => {
    if (capturas[i]) {
      dibujarZona(capturas[i], zona);
    }
  });

  // Marco encima de todas las fotos.
  ctx.drawImage(
    marco,
    0, 0,
    lienzo.width,
    lienzo.height
  );
}

async function tomarFotos() {
  if (ocupado || fase !== "camara") return;

  ocupado = true;

  const actual = sesion;
  const total = modo === "individual" ? 1 : 4;

  document.getElementById("tomar").disabled = true;

  try {
    for (let i = 0; i < total; i++) {
      if (actual !== sesion) return;

      mensaje.textContent =
        "Fotografía " + (i + 1) +
        " de " + total;

      const continuar = await contar(
        actual,
        modo === "cuatro" && i > 0
      );

      if (!continuar) return;

      capturas.push(capturarFotograma());
    }

    if (actual !== sesion) return;

    // Ahora sí aparece el marco con las fotos.
    fase = "foto";
    crearComposicionFinal();

    archivoFinal = lienzo.toDataURL(
      "image/jpeg", 0.92
    );

    detenerCamara();
    controles("foto");

    mensaje.textContent =
      "¡Así quedaron tus fotografías!";

  } catch (error) {
    mensaje.textContent = error.message;
    console.error(error);

  } finally {
    ocupado = false;
    document.getElementById("tomar").disabled = false;
  }
}

function mostrarQR() {
  if (!archivoFinal) return;

  fase = "qr";

  visible("escenario", false);
  visible("qrVista", true);
  controles("qr");

  mensaje.textContent =
    "Próximamente: QR conectado a Google Drive.";
}

function descargar() {
  if (!archivoFinal) return;

  const enlace = document.createElement("a");

  enlace.href = archivoFinal;
  enlace.download =
    "NaLu35_" + modo +
    "_" + Date.now() + ".jpg";

  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
}

function reiniciar() {
  sesion++;
  fase = "menu";
  ocupado = false;
  marco = null;
  capturas = [];
  archivoFinal = null;

  detenerCamara();

  cuenta.textContent = "";
  mensaje.textContent = "";

  visible("escenario", false);
  visible("qrVista", false);
  visible("menu", true);

  controles("");
}
</script>

</body>
</html>
